<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABACUS animation test bench</title><link rel="stylesheet" href="./src/mvc/style.css"><script type="module" src="./src/mvc/bench.js"></script></head><body>
<header><strong>ABACUS · animation test bench</strong><a href="./">Back to equation space</a></header>
<div class="bench-controls"><label>Scene <select id="scene"></select></label><label>Layout <select id="layout"><option>horizontal</option><option>vertical</option></select></label><label>Camera <select id="camera"><option>front</option><option>depth</option><option>spread</option></select></label><label>Frame <input id="frame" type="range" min="0" max="1" step=".05" value="0"></label><button id="previous">Previous frame</button><button id="next">Next frame</button><button id="run">Run visual assertions</button><button id="record-pixels">Record pixel baselines</button><button id="compare-pixels">Compare pixels</button></div>
<main id="workspace"><div id="stage"></div></main><output id="snapshot-status"></output><pre id="report" role="status">Ready. Deterministic frames, no random animation clock.</pre></body></html>
